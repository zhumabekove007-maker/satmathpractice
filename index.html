<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAT Math Practice – Algebra & Advanced Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@400;600&display=swap">
<style>
:root{
  --bg:#ffffff;--panel:#ffffff;--ink:#1a1a1a;--muted:#5b6170;--line:#d5d9e0;--soft:#f3f5f9;
  --blue:#1f4fd8;--blue-d:#143aa8;--blue-l:#e6edfd;--green:#1b7f4b;--green-l:#e3f4ea;--red:#c0392b;--red-l:#fbe9e6;--amber:#b86e00;
  --shadow:0 2px 10px rgba(20,30,60,.18);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c;--panel:#1a1e27;--ink:#eceef3;--muted:#a3a9b8;--line:#343a48;--soft:#222735;
  --blue:#7c9bff;--blue-d:#a8bcff;--blue-l:#232c4d;--green:#5fd197;--green-l:#173326;--red:#ff8b7d;--red-l:#3a1f1c;--amber:#f0b04a;--shadow:0 2px 10px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{
  --bg:#12151c;--panel:#1a1e27;--ink:#eceef3;--muted:#a3a9b8;--line:#343a48;--soft:#222735;
  --blue:#7c9bff;--blue-d:#a8bcff;--blue-l:#232c4d;--green:#5fd197;--green-l:#173326;--red:#ff8b7d;--red-l:#3a1f1c;--amber:#f0b04a;--shadow:0 2px 10px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
sup{font-size:.7em;line-height:0}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.15;font-size:.95em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .25em .05em}
.frac>span:last-child{padding:.05em .25em 0}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .title{font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .title small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.timer{display:flex;flex-direction:column;align-items:center;min-width:84px}
.timer b{font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer button{background:none;border:0;color:var(--blue);font-size:12px;padding:0;text-decoration:underline}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.tbtn:hover{background:var(--soft)}
.stripe{height:6px;background:repeating-linear-gradient(135deg,#e8b4a5 0 12px,#f4d97a 12px 24px,#9fd3b0 24px 36px,#9db8ef 36px 48px)}

/* start screen */
.start{flex:1;overflow:auto;padding:32px 20px 48px}
.wrap{max-width:900px;margin:0 auto}
.start h1{font-size:30px;line-height:1.2;margin:0 0 8px;font-weight:700}
.start p.lead{color:var(--muted);margin:0 0 28px;max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.setcard{border:1.5px solid var(--line);border-radius:10px;padding:22px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.setcard h2{margin:0;font-size:20px}
.setcard .meta{color:var(--muted);font-size:14px}
.setcard ol{margin:0;padding-left:20px;font-size:14px;color:var(--ink)}
.prog{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}
.btn{border:0;border-radius:999px;padding:10px 24px;font-weight:700;background:var(--blue);color:#fff}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:none;color:var(--blue);border:1.5px solid var(--blue)}
.btn.ghost:hover{background:var(--blue-l)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.dirs{margin-top:28px;border:1px solid var(--line);border-radius:10px;padding:18px 22px;background:var(--soft);font-size:14.5px}
.dirs h3{margin:0 0 6px;font-size:16px}
.dirs ul{margin:0;padding-left:20px}
.dirs li{margin:3px 0}

/* test screen */
.test{flex:1;display:flex;min-height:0}
.pane{flex:1;min-width:0;overflow:auto;padding:28px 36px}
.pane.left{border-right:2px solid var(--line);font-family:"Noto Serif",Georgia,serif;font-size:19px;line-height:1.65}
.pane.left .stem{max-width:60ch}
.pane.left .secname{font-family:"Noto Sans",sans-serif;font-size:13px;color:var(--muted);margin-bottom:14px}
.pane.right{background:var(--panel)}
.qhead{display:flex;align-items:center;gap:10px;background:var(--soft);border-bottom:2px solid var(--ink);margin:-28px -36px 22px;padding:8px 36px}
.qnum{background:var(--ink);color:var(--bg);font-weight:700;min-width:34px;height:34px;display:grid;place-items:center;border-radius:3px;padding:0 6px}
.flagbtn{display:flex;align-items:center;gap:6px;background:none;border:0;font-size:14px;padding:4px 6px;border-radius:4px}
.flagbtn svg{width:16px;height:16px}
.flagbtn.on{color:var(--red);font-weight:700}
.sp{flex:1}
.xbtn{border:1.5px solid var(--ink);border-radius:4px;background:var(--panel);font-size:12px;font-weight:700;padding:3px 7px;text-decoration:line-through;letter-spacing:.04em}
.xbtn.on{background:var(--ink);color:var(--bg)}
.prompt{font-weight:600;margin:0 0 14px;font-size:15px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:6px}
.copt{flex:1;display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--ink);border-radius:8px;background:var(--panel);padding:10px 14px;font-size:17px;min-height:52px}
.copt:hover{background:var(--soft)}
.copt .l{flex:none;width:28px;height:28px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.copt.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:inset 0 0 0 1.5px var(--blue)}
.copt.sel .l{background:var(--blue);border-color:var(--blue);color:#fff}
.copt.cross .txt{text-decoration:line-through;opacity:.5}
.copt.ok{border-color:var(--green);background:var(--green-l);box-shadow:inset 0 0 0 1.5px var(--green)}
.copt.ok .l{background:var(--green);border-color:var(--green);color:#fff}
.copt.bad{border-color:var(--red);background:var(--red-l);box-shadow:inset 0 0 0 1.5px var(--red)}
.copt.bad .l{background:var(--red);border-color:var(--red);color:#fff}
.cx{border:0;background:none;width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:12px;text-decoration:line-through;font-weight:700;visibility:hidden}
.crossmode .cx{visibility:visible}
.cx:hover{background:var(--soft)}
.gridin label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.gridin input{width:100%;max-width:300px;font:inherit;font-size:22px;padding:10px 14px;border:1.5px solid var(--ink);border-radius:8px;background:var(--panel);color:var(--ink);letter-spacing:.06em}
.gridin input.ok{border-color:var(--green);background:var(--green-l)}
.gridin input.bad{border-color:var(--red);background:var(--red-l)}
.gridin .hint{font-size:13px;color:var(--muted);margin-top:8px;max-width:44ch}
.preview{margin-top:14px;font-size:14px;color:var(--muted)}
.preview b{color:var(--ink);font-size:18px;margin-left:6px}
.check{margin-top:22px}
.expl{margin-top:16px;border-radius:8px;padding:12px 16px;font-size:15px;border:1.5px solid}
.expl.ok{background:var(--green-l);border-color:var(--green)}
.expl.bad{background:var(--red-l);border-color:var(--red)}
.expl b.v{display:block;margin-bottom:2px}

/* footer */
.foot{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--line);background:var(--panel)}
.foot .who{flex:1;font-weight:700;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qnav{background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:8px 16px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.foot .r{flex:1;display:flex;justify-content:flex-end;gap:10px}

/* navigator popup */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);width:min(640px,100%);max-height:88%;overflow:auto;padding:22px}
.modal h3{margin:0 0 4px;font-size:18px;text-align:center}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:3px;display:inline-block}
.navsec{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.ngrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.nb{position:relative;aspect-ratio:1;min-height:38px;border:1.5px dashed var(--blue);border-radius:4px;background:var(--panel);color:var(--blue);font-weight:700}
.nb.ans{border-style:solid;background:var(--blue);color:#fff}
.nb.cur{outline:3px solid var(--ink);outline-offset:1px}
.nb .f{position:absolute;top:-6px;right:-5px;width:14px;height:14px;color:var(--red)}
.modal .row{justify-content:center;margin-top:18px}

/* results */
.results{flex:1;overflow:auto;padding:28px 20px 60px}
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:10px 0 22px}
.big{font-size:56px;font-weight:700;line-height:1;color:var(--blue)}
.big small{font-size:22px;color:var(--muted);font-weight:500}
.bars{display:grid;gap:10px;margin:0 0 26px}
.bar{display:grid;grid-template-columns:minmax(120px,240px) 1fr 60px;gap:12px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--blue)}
.bar.weak .track i{background:var(--red)}
.bar .flagtxt{color:var(--red);font-size:12px;font-weight:700}
.rev{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;background:var(--panel);overflow:hidden}
.rev summary{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none;font-size:15px}
.rev summary::-webkit-details-marker{display:none}
.rev .badge{flex:none;min-width:32px;height:32px;border-radius:4px;display:grid;place-items:center;font-weight:700;color:#fff}
.rev.ok .badge{background:var(--green)}.rev.bad .badge{background:var(--red)}.rev.skip .badge{background:var(--muted)}
.rev .body{padding:4px 18px 16px;border-top:1px solid var(--line)}
.rev .q{font-family:"Noto Serif",Georgia,serif;margin:10px 0}
.rev .meta{font-size:14px;color:var(--muted)}
.filters{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

@media (max-width:760px){
  .test{flex-direction:column;overflow:auto}
  .pane{overflow:visible;padding:20px 16px;flex:none}
  .pane.left{border-right:0;border-bottom:2px solid var(--line);font-size:18px}
  .qhead{margin:-20px -16px 18px;padding:8px 16px}
  .top{padding:8px 12px}.foot{padding:8px 12px}
  .foot .who{display:none}.foot .r{flex:none}.foot{justify-content:space-between}
  .tbtn.hide-m{display:none}
  .ngrid{grid-template-columns:repeat(6,1fr)}
  .bar{grid-template-columns:1fr 60px}.bar .track{grid-column:1/-1;order:3}
  .start h1{font-size:25px}
}
@media (prefers-reduced-motion:no-preference){.copt,.nb{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const F=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;

/* ---------- DATA ---------- */
// [text, choices|null, answer, explanation]
const ADV=[
{name:"Equivalent expressions",from:1,to:8},{name:"Nonlinear equations in one variable",from:9,to:16},{name:"Systems with a nonlinear equation",from:17,to:24},{name:"Quadratic and nonlinear functions",from:25,to:32},{name:"Exponential and polynomial functions",from:33,to:40}];
const ALG=[
{name:"Linear equations in one variable",from:1,to:8},{name:"Linear equations in two variables",from:9,to:16},{name:"Linear functions",from:17,to:24},{name:"Systems of two linear equations",from:25,to:32},{name:"Linear inequalities",from:33,to:40}];

const ADV_Q=[
["Which of the following is equivalent to (3x² + 2x − 5) − (x² − 4x + 1)?",["2x² − 2x − 4","2x² + 6x − 6","4x² − 2x − 4","2x² + 6x − 4"],"B","Distribute the minus sign: 3x² − x² = 2x², 2x + 4x = 6x, −5 − 1 = −6."],
["When (x + 4)(2x − 3) is written in the form ax² + bx + c, where a, b, and c are constants, what is the value of b?",null,5,"(x + 4)(2x − 3) = 2x² − 3x + 8x − 12 = 2x² + 5x − 12, so b = 5."],
["Which of the following is equivalent to 16x² − 25?",["(4x − 5)²","(4x + 5)²","(4x − 5)(4x + 5)","(8x − 5)(2x + 5)"],"C","Difference of squares: (4x)² − 5² = (4x − 5)(4x + 5)."],
["The expression (2x − 3)(x + k), where k is a constant, is equivalent to 2x² − x − 3. What is the value of k?",null,1,"The constant term gives −3k = −3, so k = 1. Check the x-term: 2k − 3 = −1. ✓"],
[`Which of the following is equivalent to ${F("12a⁶b³","4a²b")}, where a and b are positive?`,["3a³b²","3a⁴b²","8a⁴b²","3a⁴b³"],"B","12/4 = 3, a⁶/a² = a⁴, b³/b = b²."],
[`Which of the following is equivalent to ${F("x² − 9","x² + 5x + 6")} for x ≠ −2 and x ≠ −3?`,[F("x − 3","x + 2"),F("x + 3","x + 2"),F("x − 3","x − 2"),F("x − 3","x + 3")],"A","Factor: (x − 3)(x + 3) / ((x + 2)(x + 3)). Cancel x + 3."],
["If x > 0, which of the following is equivalent to √(50x⁴)?",["25x²","5√2 · x²","5√2 · x⁴","10√5 · x²"],"B","√50 = 5√2 and √(x⁴) = x² for x > 0."],
[`Which of the following is equivalent to ${F("3","x − 2")} + ${F("4","x + 1")}, where x ≠ 2 and x ≠ −1?`,[F("7x − 5","(x − 2)(x + 1)"),F("7x + 5","(x − 2)(x + 1)"),F("7","(x − 2)(x + 1)"),F("7","2x − 1")],"A","Common denominator: 3(x + 1) + 4(x − 2) = 7x − 5."],
["What is the sum of the solutions to the equation x² − 5x − 14 = 0?",["−5","−2","5","14"],"C","Factor: (x − 7)(x + 2) = 0, so the solutions are 7 and −2, which sum to 5."],
["If x > 0 and x² + 3x − 28 = 0, what is the value of x?",null,4,"(x + 7)(x − 4) = 0. Since x > 0, x = 4."],
["How many distinct real solutions does the equation 3x² − 6x + 5 = 0 have?",["Zero","Exactly one","Exactly two","Infinitely many"],"A","The discriminant is (−6)² − 4(3)(5) = −24 < 0, so there are no real solutions."],
["What is the solution set of the equation √(2x + 9) = x + 3?",["{−4}","{0}","{−4, 0}","There are no solutions"],"B","Squaring gives 2x + 9 = x² + 6x + 9, so x² + 4x = 0 and x = 0 or −4. Checking: x = −4 gives √1 = −1, which is false (extraneous). Only x = 0 works."],
[`What is the product of all solutions to the equation ${F("10","x + 1")} = x − 2?`,null,-12,"10 = (x − 2)(x + 1) gives x² − x − 12 = 0, so (x − 4)(x + 3) = 0. Both solutions check, and the product is −12."],
["What is the positive difference between the two solutions to the equation |2x − 5| = 9?",["4.5","7","9","11"],"C","2x − 5 = 9 gives x = 7, and 2x − 5 = −9 gives x = −2. The difference is 9."],
["In the equation x² + bx + 16 = 0, b is a positive constant. If the equation has exactly one real solution, what is the value of b?",["4","8","16","32"],"B","Exactly one solution needs discriminant b² − 64 = 0, so b = ±8. Since b is positive, b = 8."],
["What value of x satisfies the equation 9<sup>x</sup> = 27<sup>x − 1</sup>?",["1","2","3","6"],"C","9<sup>x</sup> = 3<sup>2x</sup> and 27<sup>x−1</sup> = 3<sup>3x−3</sup>. Then 2x = 3x − 3, so x = 3."],
["Which ordered pair (x, y) is a solution to the system of equations y = x² − 4 and y = 2x − 1?",["(−1, −3)","(1, −3)","(3, 1)","(−3, 5)"],"A","Set x² − 4 = 2x − 1, so x² − 2x − 3 = 0 and x = 3 or −1. For x = −1, y = −3. Only (−1, −3) appears."],
["In the xy-plane, the graphs of y = x² + 2x − 8 and y = x + 4 intersect at two points. What is the positive difference of the x-coordinates of these two points?",null,7,"x² + 2x − 8 = x + 4 gives x² + x − 12 = 0, so x = 3 or −4. The difference is 7."],
["y = x² and y = 4x + k, where k is a constant. For which value of k does the system have exactly one solution?",["−16","−4","4","16"],"B","x² = 4x + k gives x² − 4x − k = 0. One solution needs 16 + 4k = 0, so k = −4."],
["The graphs of y = 2x² − 3x and y = x² + 4 intersect at the point (a, b) in the xy-plane, where a > 0. What is the value of b?",["8","12","16","20"],"D","2x² − 3x = x² + 4 gives x² − 3x − 4 = 0, so x = 4 or −1. With a = 4, b = 4² + 4 = 20."],
["A rectangle has a perimeter of 28 inches and an area of 48 square inches. What is the length, in inches, of the longer side of the rectangle?",null,8,"l + w = 14 and lw = 48. The numbers are 6 and 8, so the longer side is 8."],
["How many solutions does the system of equations y = x² + 3 and y = 2x have?",["Zero","Exactly one","Exactly two","Infinitely many"],"A","x² + 3 = 2x gives x² − 2x + 3 = 0. The discriminant is 4 − 12 < 0, so no real solutions."],
["x − y = 2 and xy = 15. If (x, y) is a solution to the system and x > 0, what is the value of x + y?",["3","5","8","10"],"C","Substitute y = x − 2: x² − 2x − 15 = 0, so x = 5 or −3. With x > 0, x = 5 and y = 3, so x + y = 8."],
["The graphs of y = (x − 2)² and y = 9 intersect at two points in the xy-plane. What is the sum of the x-coordinates of these two points?",["−4","0","4","9"],"C","(x − 2)² = 9 gives x − 2 = ±3, so x = 5 or −1. The sum is 4."],
["What is the minimum value of the function f(x) = x² − 6x + 5?",["−4","−3","3","5"],"A","The vertex is at x = 6/2 = 3, and f(3) = 9 − 18 + 5 = −4."],
["A ball is thrown upward from a platform. Its height, in feet, t seconds after it is thrown is given by h(t) = −16t² + 64t + 5. What is the maximum height, in feet, the ball reaches?",null,69,"The maximum occurs at t = −64/(2 × −16) = 2. Then h(2) = −64 + 128 + 5 = 69."],
["The function f is defined by f(x) = 2(x − 3)² − 8. What are the zeros of f?",["1 and 5","−1 and 5","1 and −5","3 and −8"],"A","2(x − 3)² = 8 gives (x − 3)² = 4, so x − 3 = ±2 and x = 1 or 5."],
["A parabola in the xy-plane has its vertex at (2, −5), opens upward, and passes through the point (4, 3). Which of the following is an equation of the parabola?",["y = 2(x − 2)² − 5","y = (x − 2)² − 5","y = 2(x + 2)² − 5","y = 2(x − 2)² + 5"],"A","Use y = a(x − 2)² − 5. At (4, 3): 3 = 4a − 5, so a = 2."],
["The function f(x) = x² − 8x + c has a minimum value of −5, where c is a constant. What is the value of c?",null,11,"The vertex is at x = 4, so f(4) = 16 − 32 + c = −5, giving c = 11."],
["The graph of y = f(x) in the xy-plane has a vertex at (1, −4). The function g is defined by g(x) = f(x − 3) + 2. What are the coordinates of the vertex of the graph of y = g(x)?",["(−2, −2)","(4, −2)","(−2, −6)","(4, −6)"],"B","f(x − 3) shifts the graph 3 units right (x: 1 → 4). The + 2 shifts it up (y: −4 → −2)."],
["The function f is defined by f(x) = −x² + 4x + 12. Besides x = 0, for what value of x does f(x) = 12?",["2","4","8","12"],"B","−x² + 4x = 0 gives −x(x − 4) = 0, so x = 0 or 4."],
["A farmer has 80 meters of fencing to enclose a rectangular pen. One side of the pen is a barn wall and needs no fencing, so the fencing covers the other three sides. What is the maximum possible area, in square meters, of the pen?",null,800,"Let w be the width of the two sides touching the barn, so the length is 80 − 2w and the area is A = w(80 − 2w). The maximum is at w = 20: A = 20 × 40 = 800."],

const SETS={
  alg:{key:"alg",title:"Algebra",desc:"Linear equations, functions, systems and inequalities.",secs:ALG,qs:ALG_Q},
  adv:{key:"adv",title:"Advanced Math",desc:"Equivalent expressions, nonlinear equations and functions, exponentials and polynomials.",secs:ADV,qs:ADV_Q}
};
const PACE=60*60;

/* ---------- STATE ---------- */
const store={
  load(){try{return JSON.parse(localStorage.getItem("satmath.v1")||"{}")}catch(e){return {}}},
  save(){try{localStorage.setItem("satmath.v1",JSON.stringify(S.data))}catch(e){}}
};
const S={data:store.load(),view:"start",set:null,i:0,nav:false,dirs:false,cross:false,filter:"all",hideTimer:false,tick:null};
function st(k){ // per-set state
  if(!S.data[k])S.data[k]={ans:{},flag:{},xo:{},chk:{},elapsed:0,done:false};
  return S.data[k];
}
const $app=document.getElementById("app");
const isGrid=q=>q[1]===null;
const letters=["A","B","C","D"];
function norm(v){
  let s=String(v).trim().replace(/[−–]/g,"-").replace(/\s+/g,"");
  if(!s)return NaN;
  if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){const[a,b]=s.split("/");return +a/+b}
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s))return +s;
  return NaN;
}
function isRight(set,idx){
  const q=set.qs[idx],a=st(set.key).ans[idx];
  if(a===undefined||a==="")return false;
  if(isGrid(q))return Math.abs(norm(a)-q[2])<1e-6;
  return a===q[2];
}
const answered=(set,i)=>{const a=st(set.key).ans[i];return a!==undefined&&a!==""};
const fmt=s=>{const m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0")};
const secOf=(set,n)=>set.secs.find(s=>n>=s.from&&n<=s.to);
const flagSvg='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 2h2v20H5zM8 3h12l-3 5 3 5H8z"/></svg>';

/* ---------- TIMER ---------- */
function startTimer(){
  stopTimer();
  S.tick=setInterval(()=>{
    if(S.view!=="test")return;
    const d=st(S.set.key);d.elapsed++;
    const el=document.getElementById("tm");if(el)el.textContent=fmt(d.elapsed);
    if(d.elapsed%10===0)store.save();
  },1000);
}
function stopTimer(){if(S.tick){clearInterval(S.tick);S.tick=null}}

/* ---------- VIEWS ---------- */
function render(){
  if(S.view==="start")return renderStart();
  if(S.view==="test")return renderTest();
  if(S.view==="results")return renderResults();
}
function topbar(sub,right){
  return `<div class="top"><div class="title">SAT Math Practice<small>${sub}</small></div>${right||""}<button class="tbtn" id="themeBtn" aria-label="Toggle dark mode">◐</button></div><div class="stripe"></div>`;
}
function renderStart(){
  stopTimer();
  const cards=Object.values(SETS).map(s=>{
    const d=S.data[s.key]||{ans:{}};
    const n=Object.keys(d.ans).filter(k=>d.ans[k]!==""&&d.ans[k]!==undefined).length;
    const grids=s.qs.filter(isGrid).length;
    return `<div class="setcard">
      <h2>${s.title}</h2><div class="meta">40 questions · ${40-grids} multiple-choice · ${grids} student-produced response</div>
      <div>${s.desc}</div>
      <ol>${s.secs.map(x=>`<li>${x.name} <span class="meta">(Q${x.from}–${x.to})</span></li>`).join("")}</ol>
      <div class="prog" aria-hidden="true"><i style="width:${n/40*100}%"></i></div>
      <div class="meta">${d.done?"Completed · ":""}${n} of 40 answered</div>
      <div class="row">
        <button class="btn" data-act="open" data-k="${s.key}">${n||d.done?"Continue":"Start"}</button>
        ${d.done?`<button class="btn ghost" data-act="results" data-k="${s.key}">View results</button>`:""}
        ${n||d.done?`<button class="btn ghost" data-act="reset" data-k="${s.key}">Restart</button>`:""}
      </div></div>`}).join("");
  $app.innerHTML=topbar("Digital SAT style practice")+`<main class="start"><div class="wrap">
    <h1>Pick a practice set</h1>
    <p class="lead">Two 40-question sets in the style of the digital SAT Math section. Work through them with the question navigator, flag questions to revisit, and score yourself at the end.</p>
    <div class="cards">${cards}</div>
    <div class="dirs"><h3>Directions</h3><ul>
      <li><b>Pacing:</b> about 1 min 35 s per question, or about 60 minutes for all 40.</li>
      <li><b>Calculator:</b> allowed on every question (the real test has a built-in Desmos calculator).</li>
      <li><b>Notes:</b> unless stated otherwise, all variables and constants are real numbers, the domain of a function is all real numbers for which it is defined, and figures are not necessarily drawn to scale.</li>
      <li><b>Student-produced responses:</b> type an integer, decimal or fraction (like 3/4). Answers can be positive, negative or zero.</li>
      <li><b>Your progress</b> is saved in this browser.</li></ul></div>
  </div></main>`;
  bindCommon();
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,a=b.dataset.act;
    if(a==="open"){S.set=SETS[k];S.i=0;S.view=S.data[k]&&S.data[k].done?"results":"test";S.nav=false;S.cross=false;if(S.view==="test")startTimer();render()}
    if(a==="results"){S.set=SETS[k];S.view="results";S.filter="all";render()}
    if(a==="reset"){if(confirm("Clear all answers and the timer for this set?")){delete S.data[k];store.save();render()}}
  });
}
function bindCommon(){
  const t=document.getElementById("themeBtn");
  if(t)t.onclick=()=>{
    const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#12151c";
    r.setAttribute("data-theme",dark?"light":"dark");
  };
}
function choiceHTML(set,i,q,d){
  const sel=d.ans[i],chk=d.chk[i];
  if(isGrid(q)){
    const cls=chk?(isRight(set,i)?"ok":"bad"):"";
    const v=sel??"";
    return `<div class="gridin"><label for="gi">Enter your answer</label>
      <input id="gi" type="text" inputmode="text" autocomplete="off" maxlength="9" value="${v}" class="${cls}" ${chk?"readonly":""}>
      <div class="hint">Integer, decimal or fraction (like −3/4). Up to 5 characters for positives, 6 for negatives.</div>
      <div class="preview">Answer preview:<b id="pv">${v||"—"}</b></div></div>`;
  }
  return `<div class="choices ${S.cross?"crossmode":""}">`+q[1].map((c,j)=>{
    const L=letters[j],xo=(d.xo[i]||[]).includes(L);
    let cls="copt";
    if(chk){if(L===q[2])cls+=" ok";else if(sel===L)cls+=" bad"}
    else if(sel===L)cls+=" sel";
    if(xo)cls+=" cross";
    return `<div class="choice"><button class="${cls}" data-pick="${L}" aria-pressed="${sel===L}"><span class="l">${L}</span><span class="txt">${c}</span></button>
      <button class="cx" data-x="${L}" aria-label="Cross out choice ${L}">${L}</button></div>`}).join("")+`</div>`;
}
function explHTML(set,i,q,d){
  if(!d.chk[i])return "";
  const ok=isRight(set,i);
  const ans=isGrid(q)?String(q[2]).replace("-","−"):q[2];
  return `<div class="expl ${ok?"ok":"bad"}"><b class="v">${ok?"Correct":(answered(set,i)?"Not quite":"No answer entered")} · answer: ${ans}</b>${q[3]}</div>`;
}
function renderTest(){
  const set=S.set,d=st(set.key),i=S.i,q=set.qs[i],n=i+1,sec=secOf(set,n);
  const tm=`<div class="timer"><b id="tm" ${S.hideTimer?'style="display:none"':""}>${fmt(d.elapsed)}</b><button id="tmBtn">${S.hideTimer?"Show":"Hide"}</button></div>`;
  $app.innerHTML=topbar(`${set.title} · Section ${set.secs.indexOf(sec)+1}: ${sec.name}`,tm+`<button class="tbtn hide-m" id="exit">Exit</button>`)+
  `<main class="test">
    <section class="pane left" aria-label="Question"><div class="stem"><div class="secname">${sec.name}</div>${q[0]}</div></section>
    <section class="pane right" aria-label="Answer">
      <div class="qhead"><span class="qnum">${n}</span>
        <button class="flagbtn ${d.flag[i]?"on":""}" id="flag" aria-pressed="${!!d.flag[i]}">${flagSvg}<span>${d.flag[i]?"Marked for review":"Mark for review"}</span></button>
        <span class="sp"></span>
        ${isGrid(q)?"":`<button class="xbtn ${S.cross?"on":""}" id="xmode" aria-pressed="${S.cross}" title="Cross out answer choices">ABC</button>`}
      </div>
      <p class="prompt">${isGrid(q)?"Student-produced response":"Choose the correct answer"}</p>
      ${choiceHTML(set,i,q,d)}
      <div class="check row">${d.chk[i]?"":`<button class="btn ghost" id="check">Check answer</button>`}</div>
      ${explHTML(set,i,q,d)}
    </section>
  </main>
  <div class="foot"><div class="who">Student · ${set.title}</div>
    <button class="qnav" id="qnav" aria-haspopup="dialog">Question ${n} of 40 <span aria-hidden="true">▴</span></button>
    <div class="r"><button class="btn ghost" id="back" ${i===0?"disabled":""}>Back</button>
    ${i===39?`<button class="btn" id="finish">Finish</button>`:`<button class="btn" id="next">Next</button>`}</div></div>`+(S.nav?navModal(set,d,i):"");
  bindCommon();
  const $=id=>document.getElementById(id);
  $("tmBtn").onclick=()=>{S.hideTimer=!S.hideTimer;renderTest()};
  $("exit").onclick=()=>{store.save();stopTimer();S.view="start";render()};
  $("flag").onclick=()=>{d.flag[i]=!d.flag[i];store.save();renderTest()};
  const xm=$("xmode");if(xm)xm.onclick=()=>{S.cross=!S.cross;renderTest()};
  $("back").onclick=()=>{S.i=Math.max(0,i-1);store.save();renderTest();scrollTop()};
  const nx=$("next");if(nx)nx.onclick=()=>{S.i=Math.min(39,i+1);store.save();renderTest();scrollTop()};
  const fn=$("finish");if(fn)fn.onclick=()=>{S.nav=true;renderTest()};
  $("qnav").onclick=()=>{S.nav=true;renderTest()};
  const ck=$("check");if(ck)ck.onclick=()=>{d.chk[i]=true;store.save();renderTest()};
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    if(d.chk[i])return;
    d.ans[i]=d.ans[i]===b.dataset.pick?undefined:b.dataset.pick;
    if(d.ans[i]===undefined)delete d.ans[i];
    store.save();renderTest();
  });
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
    const L=b.dataset.x,a=d.xo[i]||(d.xo[i]=[]);
    const k=a.indexOf(L);k>=0?a.splice(k,1):a.push(L);store.save();renderTest();
  });
  const gi=$("gi");
  if(gi&&!d.chk[i])gi.oninput=()=>{
    gi.value=gi.value.replace(/[^0-9.\/\-−]/g,"");
    if(gi.value)d.ans[i]=gi.value;else delete d.ans[i];
    $("pv").textContent=gi.value||"—";store.save();
  };
  if(S.nav)bindNav(set,d);
}
function scrollTop(){document.querySelectorAll(".pane").forEach(p=>p.scrollTop=0);window.scrollTo(0,0)}
function navModal(set,d,cur){
  let h=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="Question navigator">
  <h3>${set.title} · Questions</h3>
  <div class="legend"><span><i class="sw" style="outline:2px solid var(--ink)"></i>Current</span><span><i class="sw" style="border:1.5px dashed var(--blue)"></i>Unanswered</span><span><i class="sw" style="background:var(--blue)"></i>Answered</span><span style="color:var(--red)">${flagSvg.replace("<svg","<svg width='14' height='14'")}For review</span></div>`;
  set.secs.forEach((s,si)=>{
    h+=`<div class="navsec">Section ${si+1}: ${s.name}</div><div class="ngrid">`;
    for(let n=s.from;n<=s.to;n++){const k=n-1;
      h+=`<button class="nb ${answered(set,k)?"ans":""} ${k===cur?"cur":""}" data-go="${k}" aria-label="Question ${n}${answered(set,k)?", answered":""}${d.flag[k]?", flagged":""}">${n}${d.flag[k]?`<span class="f">${flagSvg}</span>`:""}</button>`}
    h+=`</div>`});
  const un=40-Object.keys(d.ans).filter(k=>answered(set,+k)).length;
  h+=`<div class="row"><button class="btn ghost" id="closeNav">Close</button><button class="btn" id="score">Finish &amp; score${un?` (${un} blank)`:""}</button></div></div></div>`;
  return h;
}
function bindNav(set,d){
  const $=id=>document.getElementById(id);
  $("scrim").onclick=e=>{if(e.target.id==="scrim"){S.nav=false;renderTest()}};
  $("closeNav").onclick=()=>{S.nav=false;renderTest()};
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.i=+b.dataset.go;S.nav=false;renderTest();scrollTop()});
  $("score").onclick=()=>{
    const un=40-Object.keys(d.ans).filter(k=>answered(set,+k)).length;
    if(un&&!confirm(un+" question"+(un>1?"s are":" is")+" unanswered. Finish and score anyway?"))return;
    d.done=true;S.nav=false;stopTimer();store.save();S.view="results";S.filter="all";render();window.scrollTo(0,0);
  };
}
function renderResults(){
  stopTimer();
  const set=S.set,d=st(set.key);
  let right=0,skipped=0;
  const per=set.secs.map(s=>{let r=0,t=0;for(let k=s.from-1;k<s.to;k++){t++;if(isRight(set,k))r++}return{...s,r,t}});
  for(let k=0;k<40;k++){if(isRight(set,k))right++;if(!answered(set,k))skipped++}
  const pct=Math.round(right/40*100);
  const items=set.qs.map((q,k)=>{
    const st_=isRight(set,k)?"ok":(answered(set,k)?"bad":"skip");
    return{q,k,st:st_}}).filter(o=>S.filter==="all"||(S.filter==="wrong"&&o.st!=="ok")||(S.filter==="flag"&&d.flag[o.k]));
  const mine=(o)=>{const a=d.ans[o.k];return a===undefined||a===""?"No answer":(isGrid(o.q)?a:a)};
  $app.innerHTML=topbar(`${set.title} · Results`,`<button class="tbtn" id="home">All sets</button>`)+
  `<main class="results"><div class="wrap">
    <div class="score"><div class="big">${right}<small> / 40</small></div>
      <div><div style="font-size:18px;font-weight:700">${pct}% correct</div>
      <div class="meta" style="color:var(--muted)">Time: ${fmt(d.elapsed)} (pace target ${fmt(PACE)}) · ${skipped} unanswered</div></div>
      <div class="row" style="margin-left:auto"><button class="btn ghost" id="retry">Keep practicing</button></div></div>
    <h3 style="margin:0 0 10px">By section</h3>
    <div class="bars">${per.map(p=>{const weak=p.t-p.r>=3;return `<div class="bar ${weak?"weak":""}"><span>${p.name}${weak?` <span class="flagtxt">· review</span>`:""}</span><span class="track"><i style="width:${p.r/p.t*100}%"></i></span><span>${p.r} / ${p.t}</span></div>`}).join("")}</div>
    <p class="meta" style="color:var(--muted);margin-top:-14px">Sections where you missed 3 or more are marked for review.</p>
    <h3 style="margin:22px 0 10px">Review answers</h3>
    <div class="filters">${[["all","All 40"],["wrong","Missed or blank"],["flag","Marked for review"]].map(([k,l])=>`<button class="chip ${S.filter===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>
    ${items.length?items.map(o=>`<details class="rev ${o.st}"><summary><span class="badge">${o.k+1}</span><span>${o.st==="ok"?"Correct":o.st==="bad"?"Incorrect":"Unanswered"} <span style="color:var(--muted)">· ${secOf(set,o.k+1).name}</span></span></summary>
      <div class="body"><div class="q">${o.q[0]}</div>
      ${isGrid(o.q)?"":`<div class="q" style="font-size:16px">${o.q[1].map((c,j)=>`<div>${letters[j]}) ${c}</div>`).join("")}</div>`}
      <div class="meta">Your answer: <b>${mine(o)}</b> · Correct answer: <b>${String(o.q[2]).replace("-","−")}</b></div>
      <div class="expl ${o.st==="ok"?"ok":"bad"}" style="margin-top:10px">${o.q[3]}</div></div></details>`).join(""):`<p style="color:var(--muted)">Nothing here.</p>`}
  </div></main>`;
  bindCommon();
  document.getElementById("home").onclick=()=>{S.view="start";render()};
  document.getElementById("retry").onclick=()=>{S.view="test";S.i=0;startTimer();render()};
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;renderResults()});
}
document.addEventListener("keydown",e=>{
  if(S.view!=="test"||e.target.tagName==="INPUT")return;
  if(e.key==="Escape"&&S.nav){S.nav=false;renderTest()}
  else if(e.key==="ArrowRight"&&!S.nav&&S.i<39){S.i++;renderTest();scrollTop()}
  else if(e.key==="ArrowLeft"&&!S.nav&&S.i>0){S.i--;renderTest();scrollTop()}
});
document.head.insertAdjacentHTML("beforeend","<style>.tbl{border-collapse:collapse;margin:12px 0;font-family:'Noto Sans',sans-serif;font-size:17px}.tbl th,.tbl td{border:1.5px solid var(--ink);padding:6px 16px;text-align:center}.tbl th{background:var(--soft);font-weight:600}</style>");
render();
</script>
</body>
</html>
